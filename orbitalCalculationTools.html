<body>

    <br>
    <br>
    <div class="box">
        <span class="label"> CIRCULAR_ORBITS</span>
        <div class="grid">

            <div class="box">
                <span class="label">SATELLITE_ORBIT_SPEED_CALCULATOR</span>
                <form id="OrbitalSpeedCalc">
                    <div>
                        <label for="height">Orbit Height:</label>
                        <input type="number" id="scH" name="scH" step="any" required>
                        <label>x 10^</label>
                        <input type="number" id="scHe" name="scHe" value="0" required>
                        <label>m</label>
                    </div>
                    <div>
                        <label for="G">Gravitational Constant:</label>
                        <input type="number" id="scG" name="scG" step="any" value="6.6743" required>
                        <label>x 10^</label>
                        <input type="number" id="scGe" name="scGe" value="-11" required>
                        <label>m<sup>3</sup> kg<sup>-1</sup> s<sup>-2</sup></label>
                    </div>
                    <div>
                        <label for="mass">Planetary Mass:</label>
                        <input type="number" id="scM" name="scM" step="any" value="5.9722" required>
                        <label>x 10^</label>
                        <input type="number" id="scMe" name="scMe" value="24" required>
                        <label>kg</label>
                    </div>
                    <div>
                        <label for="radius">Planetary Radius:</label>
                        <input type="number" id="scR" name="scR" step="any" value="6.371" required>
                        <label>x 10^</label>
                        <input type="number" id="scRe" name="scRe" value="6" required>
                        <label>m</label>
                    </div>
                    <button type="submit">Calculate</button>
                </form>
                <p id="speedCalcRes">Orbital Speed: -</p>
            </div>

            <div class="box">
                <span class="label">SATELLITE_ORBITAL_PERIOD_CALCULATOR</span>
                <form id="OrbitalPeriodCalc">
                    <div>
                        <label for="height">Orbit Height:</label>
                        <input type="number" id="pcH" name="pcH" step="any" required>
                        <label>x 10^</label>
                        <input type="number" id="pcHe" name="pcHe" value="0" required>
                        <label>m</label>
                    </div>
                    <div>
                        <label for="G">Gravitational Constant:</label>
                        <input type="number" id="pcG" name="pcG" step="any" value="6.6743" required>
                        <label>x 10^</label>
                        <input type="number" id="pcGe" name="pcGe" value="-11" required>
                        <label>m<sup>3</sup> kg<sup>-1</sup> s<sup>-2</sup></label>
                    </div>
                    <div>
                        <label for="mass">Planetary Mass:</label>
                        <input type="number" id="pcM" name="pcM" step="any" value="5.9722" required>
                        <label>x 10^</label>
                        <input type="number" id="pcMe" name="pcMe" value="24" required>
                        <label>kg</label>
                    </div>
                    <div>
                        <label for="radius">Planetary Radius:</label>
                        <input type="number" id="pcR" name="pcR" step="any" value="6.371" required>
                        <label>x 10^</label>
                        <input type="number" id="pcRe" name="pcRe" value="6" required>
                        <label>m</label>
                    </div>
                    <button type="submit">Calculate</button>
                </form>
                <p id="periodCalcRes">Orbital Period: -</p>
            </div>
        </div>
    </div>
    
    <br>

        <span class="label">ELLIPTICAL_ORBITS</span>

    </div>
